[package]
name = "dsql-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dsql-core = { workspace = true }
dsql-frontend = { workspace = true }
dsql-generate = { workspace = true }
dsql-project = { workspace = true }
ropey = { workspace = true, features = ["metric_utf16"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
insta = { workspace = true }

[[test]]
name = "snapshot"
path = "snapshot.rs"
