database_url = "<set by ../.env or DSQL_DATABASE_URL>"
default_schema = "public"
documents = []

[resolution.shared]
documents = [{ resolver = "dsql", paths = ["queries/shared/**/*.dsql"] }]

[resolution.api]
documents = [{ resolver = "dsql", paths = ["queries/api/**/*.dsql"] }]
imports = ["shared"]

[resolution.analytics]
documents = [{ resolver = "dsql", paths = ["queries/analytics/**/*.dsql"] }]
imports = ["shared"]

[lint]
unindexed_scan_severity = "warning"
