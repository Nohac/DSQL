---
schema: public
name: wide_integer_values
object_type: table
columns:
  - name: value
    provider_type:
      schema: pg_catalog
      name: int8
    formatted_type: bigint
    type_modifier: -1
    database_type: int8
    data_type: bigint
    not_null: true
constraints:
  - name: wide_integer_values_pkey
    kind: primary_key
    columns:
      - value
indexes:
  - name: wide_integer_values_pkey
    access_method: btree
    keys:
      - column: value
        operator_class: pg_catalog.int8_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
