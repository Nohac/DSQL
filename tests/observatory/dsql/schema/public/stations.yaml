---
schema: public
name: stations
object_type: table
description: Physical stations that collect observations.
columns:
  - name: tenant_id
    provider_type:
      schema: pg_catalog
      name: uuid
    database_type: uuid
    data_type: uuid
    not_null: true
  - name: network_code
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: code
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: name
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: latitude
    provider_type:
      schema: pg_catalog
      name: numeric
    database_type: numeric
    data_type: numeric
    not_null: true
  - name: longitude
    provider_type:
      schema: pg_catalog
      name: numeric
    database_type: numeric
    data_type: numeric
    not_null: true
  - name: commissioned_at
    provider_type:
      schema: pg_catalog
      name: timestamptz
    database_type: timestamptz
    data_type: timestamptz
    not_null: true
  - name: metadata
    description: Provider-specific station attributes.
    provider_type:
      schema: pg_catalog
      name: jsonb
    database_type: jsonb
    data_type: json
    not_null: true
constraints:
  - name: stations_pkey
    kind: primary_key
    columns:
      - tenant_id
      - network_code
      - code
foreign_keys:
  - name: stations_tenant_id_network_code_fkey
    columns:
      - tenant_id
      - network_code
    references:
      schema: public
      table: networks
      columns:
        - tenant_id
        - code
indexes:
  - name: stations_pkey
    access_method: btree
    keys:
      - column: tenant_id
        operator_class: pg_catalog.uuid_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: network_code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
