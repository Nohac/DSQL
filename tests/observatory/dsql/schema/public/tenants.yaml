---
schema: public
name: tenants
object_type: table
columns:
  - name: id
    provider_type:
      schema: pg_catalog
      name: uuid
    formatted_type: uuid
    type_modifier: -1
    database_type: uuid
    data_type: uuid
    not_null: true
  - name: name
    provider_type:
      schema: pg_catalog
      name: text
    formatted_type: text
    type_modifier: -1
    database_type: text
    data_type: text
    not_null: true
constraints:
  - name: tenants_name_key
    kind: unique
    columns:
      - name
  - name: tenants_pkey
    kind: primary_key
    columns:
      - id
indexes:
  - name: tenants_name_key
    access_method: btree
    keys:
      - column: name
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
  - name: tenants_pkey
    access_method: btree
    keys:
      - column: id
        operator_class: pg_catalog.uuid_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
