---
schema: public
name: sensors
object_type: table
columns:
  - name: tenant_id
    provider_type:
      schema: pg_catalog
      name: uuid
    database_type: uuid
    data_type: uuid
    not_null: true
  - name: network_code
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: station_code
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: code
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: unit
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
constraints:
  - name: sensors_pkey
    kind: primary_key
    columns:
      - tenant_id
      - network_code
      - station_code
      - code
foreign_keys:
  - name: sensors_tenant_id_network_code_station_code_fkey
    columns:
      - tenant_id
      - network_code
      - station_code
    references:
      schema: public
      table: stations
      columns:
        - tenant_id
        - network_code
        - code
indexes:
  - name: sensors_code_search_idx
    access_method: gin
    keys:
      - column: code
        operator_class: public.gin_trgm_ops
        capabilities:
          - equality
          - like
    unique: false
  - name: sensors_pkey
    access_method: btree
    keys:
      - column: tenant_id
        operator_class: pg_catalog.uuid_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: network_code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: station_code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
