---
schema: public
name: networks
object_type: table
description: Named observation networks within a tenant.
columns:
  - name: tenant_id
    provider_type:
      schema: pg_catalog
      name: uuid
    database_type: uuid
    data_type: uuid
    not_null: true
  - name: code
    description: Stable network code within its tenant.
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: name
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: active
    provider_type:
      schema: pg_catalog
      name: bool
    database_type: bool
    data_type: boolean
    not_null: true
constraints:
  - name: networks_pkey
    kind: primary_key
    columns:
      - tenant_id
      - code
foreign_keys:
  - name: networks_tenant_id_fkey
    columns:
      - tenant_id
    references:
      schema: public
      table: tenants
      columns:
        - id
indexes:
  - name: networks_pkey
    access_method: btree
    keys:
      - column: tenant_id
        operator_class: pg_catalog.uuid_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
      - column: code
        operator_class: pg_catalog.text_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
