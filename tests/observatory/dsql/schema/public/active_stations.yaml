  - name: code
    description: Station code within the composite network key.
    provider_type:
      schema: pg_catalog
      name: text
    formatted_type: text
    type_modifier: -1
    database_type: text
    data_type: text
    not_null: false
  - name: name
    provider_type:
      schema: pg_catalog
      name: text
    formatted_type: text
    type_modifier: -1
    database_type: text
    data_type: text
    not_null: false
