[package]
name = "dsql-generate"
version.workspace = true
edition.workspace = true

[features]
default = ["native"]
native = ["dep:dsql-project", "dep:fd-lock", "dep:tokio"]

[dependencies]
bowl = { workspace = true }
dsql-core = { workspace = true }
dsql-metadata = { workspace = true }
dsql-project = { workspace = true, optional = true }
facet = { workspace = true }
facet-json = { workspace = true }
facet-yaml = { workspace = true }
fd-lock = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
indoc = { workspace = true }
insta = { workspace = true }
dsql-metadata = { workspace = true }
facet-json = { workspace = true }
tempfile = { workspace = true }
