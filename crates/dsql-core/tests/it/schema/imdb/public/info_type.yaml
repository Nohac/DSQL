---
schema: public
name: info_type
object_type: table
columns:
  - name: id
    provider_type:
      schema: pg_catalog
      name: int4
    formatted_type: integer
    type_modifier: -1
    database_type: int4
    data_type: int
    not_null: true
  - name: info
    provider_type:
      schema: pg_catalog
      name: varchar
    formatted_type: character varying(32)
    type_modifier: 36
    database_type: varchar
    data_type: text
    not_null: true
constraints:
  - name: info_type_pkey
    kind: primary_key
    columns:
      - id
indexes:
  - name: info_type_pkey
    access_method: btree
    keys:
      - column: id
        operator_class: pg_catalog.int4_ops
        capabilities:
          - equality
          - range
        order:
          direction: asc
          nulls: last
    unique: true
