---
schema: public
name: keyword
object_type: table
columns:
  - name: id
    provider_type:
      schema: pg_catalog
      name: int4
    database_type: int4
    data_type: int
    not_null: true
  - name: keyword
    provider_type:
      schema: pg_catalog
      name: text
    database_type: text
    data_type: text
    not_null: true
  - name: phonetic_code
    provider_type:
      schema: pg_catalog
      name: varchar
    database_type: varchar
    data_type: text
    not_null: false
constraints:
  - name: keyword_pkey
    kind: primary_key
    columns:
      - id
indexes:
  - name: keyword_pkey
    access_method: btree
    keys:
      - column: id
    unique: true
