---
schema: public
name: role_type
object_type: table
columns:
  - name: id
    provider_type:
      schema: pg_catalog
      name: int4
    database_type: int4
    data_type: int
    not_null: true
  - name: role
    provider_type:
      schema: pg_catalog
      name: varchar
    database_type: varchar
    data_type: text
    not_null: true
constraints:
  - name: role_type_pkey
    kind: primary_key
    columns:
      - id
indexes:
  - name: role_type_pkey
    access_method: btree
    keys:
      - column: id
    unique: true
