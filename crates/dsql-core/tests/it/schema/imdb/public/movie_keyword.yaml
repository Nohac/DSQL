---
schema: public
name: movie_keyword
object_type: table
columns:
  - name: id
    provider_type:
      schema: pg_catalog
      name: int4
    database_type: int4
    data_type: int
    not_null: true
  - name: movie_id
    provider_type:
      schema: pg_catalog
      name: int4
    database_type: int4
    data_type: int
    not_null: true
  - name: keyword_id
    provider_type:
      schema: pg_catalog
      name: int4
    database_type: int4
    data_type: int
    not_null: true
constraints:
  - name: movie_keyword_pkey
    kind: primary_key
    columns:
      - id
foreign_keys:
