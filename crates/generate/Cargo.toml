[package]
name = "dsql-generate"
version = "0.1.0"
edition = "2024"

[features]
default = ["fs", "process"]
fs = ["tokio/fs"]
process = ["tokio/process"]

[dependencies]
dsql-core = { path = "../core" }
dsql-metadata = { path = "../metadata" }
dsql-project = { path = "../project" }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
