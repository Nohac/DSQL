[package]
name = "dsql-core"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = "1"
codespan-reporting = "0.13"
facet = "0.46.2"
facet-yaml = "0.46.0"
indexmap = "2"
lasso = "0.7"
