[package]
name = "dsql-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dsql"
path = "src/main.rs"

[dependencies]
dsql-core = { workspace = true }
dsql-frontend = { workspace = true }
dsql-generate = { workspace = true }
dsql-introspection = { workspace = true }
dsql-lsp = { workspace = true }
dsql-metadata = { workspace = true }
dsql-project = { workspace = true }
clap = { workspace = true, features = ["derive"] }
facet = { workspace = true }
facet-json = { workspace = true }
facet-toml = { workspace = true, features = ["serialize"] }
miette = { workspace = true, features = ["fancy"] }
ropey = { workspace = true, features = ["metric_lines_lf"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
