[package]
name = "dsql-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dsql"
path = "src/main.rs"

[dependencies]
dsql-core = { path = "../core" }
dsql-frontend = { path = "../frontend" }
dsql-introspection = { path = "../introspection" }
dsql-lsp = { path = "../lsp" }
dsql-project = { path = "../project" }
clap = { version = "4", features = ["derive"] }
facet = "0.44.1"
facet-toml = { version = "0.44.1", features = ["serialize"] }
miette = { version = "7", features = ["fancy"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
