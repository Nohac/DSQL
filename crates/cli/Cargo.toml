[package]
name = "dsql-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dsql"
path = "src/main.rs"

[dependencies]
dsql-core = { path = "../core" }
dsql-frontend = { path = "../frontend" }
dsql-lsp = { path = "../lsp" }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
