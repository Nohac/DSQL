database_url = "<database url>"
default_schema = "public"

[embedding.custom]
strategy = "regex"
pattern = 'dsql(?:\s*\(\s*)?`(?P<content>[\s\S]*?)`(?:\s*\))?'

[resolution.shared]
documents = [{ resolver = "dsql", paths = ["queries/shared/**/*.dsql"] }]

[resolution.frontend]
documents = [
  { resolver = "dsql", paths = ["queries/frontend/**/*.dsql"] },
  { resolver = "typescript", paths = ["src/**/*.ts", "src/**/*.tsx"] },
  { resolver = "custom", paths = ["src/**/*.component"] },
]
imports = ["shared"]

[lint]
unindexed_scan_severity = "warning"
