[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/lelwel", "vendor/logos"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dsql-core = { path = "crates/dsql-core" }
dsql-generate = { path = "crates/dsql-generate" }
dsql-introspection = { path = "crates/dsql-introspection" }
dsql-metadata = { path = "crates/dsql-metadata" }
dsql-project = { path = "crates/dsql-project" }

bowl = { git = "https://github.com/Nohac/porridge", rev = "85c952d" }
lelwel = { path = "vendor/lelwel" }
miette = { version = "7", features = ["fancy"] }
logos = { path = "vendor/logos" }

clap = { version = "4.5", features = ["derive"] }
codespan-reporting = "0.13"
facet = "0.50.0-rc.1"
facet-json = "0.50.0-rc.1"
facet-json-schema = "0.50.0-rc.1"
facet-toml = "0.50.0-rc.1"
facet-typescript = "0.50.0-rc.1"
facet-yaml = "0.50.0-rc.1"
futures = "0.3"
glob = "0.3"
regex = "1"
insta = "1.48"
ropey = { version = "2.0.0-beta.1", features = ["metric_utf16"] }
sea-query = { version = "1.0.1", default-features = false, features = ["backend-postgres"] }
serde_json = "1"
sqlformat = "0.5"
sqlx = { version = "0.9", default-features = false }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "process", "sync", "time"] }
tower-lsp-server = "0.23"
